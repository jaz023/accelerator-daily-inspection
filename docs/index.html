<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accelerator Daily Inspection</title><style>body{font-family:Arial;max-width:1100px;margin:auto;padding:20px;background:#eef3f1}.panel,.row{background:#fff;padding:16px;margin:10px 0;border:1px solid #ccd8d3;border-radius:10px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}input,select,button{padding:9px;font:inherit}.bad{color:#b43f2d}.ok{color:#176b50}@media(max-width:760px){.meta,.row{grid-template-columns:1fr}}</style><h1>Accelerator Daily Inspection</h1><p>Electronic record for reference only. The signed paper sheet remains the official record.</p><section class="panel"><div class="meta"><label>Record type<select id="entryType"><option>Current</option><option>Historical</option></select></label><label>Date<input id="date" type="date"></label><label>Completion time<input id="time" type="time"></label><label>Inspection type<select id="mode"><option>Startup</option><option>Shutdown</option></select></label><label>Operator 1 *<input id="op1" required></label><label>Operator 2<input id="op2"></label></div></section><form id="form"></form><button form="form">Save all to Google Sheet</button> <span id="status"></span><script>const API='https://script.google.com/macros/s/AKfycbx0Bj7pIwszUgv9O8mkLNjoGUj01i6jMz_wAFYzCER9XBjHOdx1sdtGjD8N79WzQPyqiA/exec',e=id=>document.getElementById(id),common=[['room_th','Accelerator room temperature / Humidity','22-26°C / <60%','th'],['bt_th','BT line temperature / Humidity','22-26°C / <60%','th'],['power_th','Power supply room temperature / humidity','22-26°C / <60%','th']],startup=[['coil','Maximum upper coil temperature','< 6.7 K'],['lead','Maximum power lead temperature','< 65 K'],['vacuum_a','Vacuum pressure (before startup) (A)','<2.0E-4 Pa'],['vacuum_ba','Difference pressure between (B) and (A)','<0.5E-5 Pa'],['sector','Sector temperature','<33 °C'],['filament','Filament current / operation times','>90A / <2000mins'],['cryo_a','Cryopump-A 2nd / 1st temperature','<20 / <85 K'],['cryo_b','Cryopump-B 2nd / 1st temperature','<20 / <85 K'],['cryo_flow','Cryopump water flow rate','>9 L/min'],['cooler_flow','Cryocooler water flow rate (A/B/C/D)','>9 L/min']],shutdown=[['vacuum_gas','Vacuum pressure with gas','<2.0E-3 Pa'],['coil_stop','Maximum upper coil temperature','<6.7 K'],['lead_stop','Maximum power lead temperature','<65 K'],['cryo_a_stop','Cryopump-A 2nd / 1st temperature','<20 / <85 K'],['cryo_b_stop','Cryopump-B 2nd / 1st temperature','<20 / <85 K']];e('date').value=new Date().toISOString().slice(0,10);e('time').value=new Date().toTimeString().slice(0,5);function items(){return[...common,...(e('mode').value==='Startup'?startup:shutdown)]}function render(){e('form').innerHTML=items().map(x=>`<div class="row" data-id="${x[0]}"><div><b>${x[1]}</b><br><small>Standard: ${x[2]}</small></div><input class="v" placeholder="${x[3]==='th'?'Temperature °C / Humidity %':'Enter displayed value'}" required><input class="remark" placeholder="Remark"></div>`).join('')}e('mode').onchange=render;render();e('form').onsubmit=async ev=>{ev.preventDefault();let rs=[...document.querySelectorAll('.row')],miss=rs.filter(r=>!r.querySelector('.v').value.trim()),op=e('op1').value.trim();if(!op||miss.length){e('status').textContent=miss.length?`Please complete all ${miss.length} remaining value(s).`:'Operator 1 is required.';e('status').className='bad';return}let rows=rs.map(r=>{let x=items().find(i=>i[0]===r.dataset.id),v=r.querySelector('.v').value,n=v.match(/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g)||[],th=x[3]==='th';return{parameterId:x[0],checkItem:x[1],unit:th?'°C / %':'',standardValue:x[2],recordedValue:v,value1:th?(n[0]||''):'',value2:th?(n[1]||''):'',value3:th?'':(n[0]||''),value4:th?'':(n[1]||''),value5:th?'':(n[2]||''),value6:th?'':(n[3]||''),remark:r.querySelector('.remark').value}}),p={recordId:`${e('date').value}-${Date.now()}`,inspectionDate:e('date').value,completionTime:e('time').value,inspectionType:e('mode').value,workMode:e('op2').value.trim()?'Two operators':'Single operator',operator1:op,operator2:e('op2').value.trim(),measurements:rows};e('status').textContent='Saving…';try{let o=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})).json();if(!o.ok)throw Error(o.error);e('status').textContent=`Saved ${o.rowsAdded} rows with value1-value6.`;e('status').className='ok'}catch(err){e('status').textContent='Save failed: '+err.message;e('status').className='bad'}};</script>
