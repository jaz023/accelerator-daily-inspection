<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accelerator Daily Inspection</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Accelerator Daily Inspection</h1><p class="note">Electronic record for reference only. The signed paper sheet remains the official record.</p><section class="panel"><div class="meta"><label>Date<input id="date" type="date"></label><label>Completion time<input id="time" type="time"></label><label>Inspection type<select id="mode"><option>Startup</option><option>Shutdown</option></select></label><label>Operator 1 *<input id="op1" required></label><label>Operator 2<input id="op2"></label></div></section><form id="form"></form><button form="form">Save all to Google Sheet</button> <span id="status"></span><section class="panel trend-panel"><div class="trend-head"><div><h2>Check Item Trend</h2><p class="note">Select one check item to view its values over time.</p></div><label>Check item<select id="trendItem"><option>Loading…</option></select></label></div><canvas id="trendChart" width="1000" height="420"></canvas><p id="trendStatus" class="note">Loading Google Sheet data…</p></section></main><script src="app.js?v=20261002-7"></script></body></html>
