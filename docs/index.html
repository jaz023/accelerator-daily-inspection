<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accelerator Daily Inspection</title><style>:root{font-family:Arial,sans-serif;color:#17231f;background:#eef3f1}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:22px}header,.panel,.group{background:#fff;border:1px solid #ccd8d3;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #17231f12}h1{margin:0 0 6px}.muted{color:#64716c}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}label{font-weight:700;font-size:.9rem}input,select,button{font:inherit;border:1px solid #b9c8c1;border-radius:8px;padding:10px;background:#fff}button{cursor:pointer;background:#176b50;color:#fff;border:0;font-weight:700}button.secondary{background:#e4ece8;color:#17231f}.hint{font-size:.8rem;color:#64716c}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.3fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e5ece9}.row:first-child{border-top:0}.row small{color:#64716c}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-weight:700}.ok{color:#176b50}.bad{color:#b43f2d}@media(max-width:760px){.meta,.row{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><header><h1>Accelerator Daily Inspection</h1><div class="muted">Electronic record for reference only. The signed paper sheet remains the official record.</div></header><section class="panel"><div class="meta"><div class="field"><label>Record type</label><select id="entryType"><option>Current</option><option>Historical</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Completion time</label><input id="time" type="time"><span id="timeHint" class="hint">Auto-recorded when submitted</span></div><div class="field"><label>Inspection type</label><select id="mode"><option>Startup</option><option>Shutdown</option></select></div><div class="field"><label>Operator 1 *</label><input id="op1" required></div><div class="field"><label>Operator 2</label><input id="op2"></div></div></section><form id="form"></form><section class="panel actions"><button type="submit" form="form">Save to Google Sheet</button><button type="button" class="secondary" id="clear">Clear</button><span id="status" class="status"></span></section></main><script>
const API='https://script.google.com/macros/s/AKfycbzCwHSg6xebukXM-WoqBrzgr74Lq31ug_iFPZQG4oXfyQhdfcnjfF0Or3J9RJmw1iJd0g/exec';const common=[['room_th','Accelerator room temperature / Humidity','22-26°C / <60%','th'],['bt_th','BT ambient temperature / Humidity','22-26°C / <60%','th'],['power_th','Power supply room temperature / humidity','22-26°C / <60%','th'],['water_leak','Water leakage check','No leakage','choice'],['gas_leak','Gas leakage, unusual odor or frosting','No abnormality','choice'],['noise','Abnormal noise or vibration','No abnormality','choice']];const startup=[['coil','Maximum upper coil temperature','< 6.7 K','value'],['lead','Maximum power lead temperature','< 65 K','value'],['vacuum_a','Vacuum pressure (before startup) (A)','<2.0E-4 Pa','value'],['vacuum_ba','Difference pressure between (B) and (A)','<0.5E-5 Pa','value'],['sector','Sector temperature','<33 °C','value'],['filament','Filament current / operation times','>90A / <2000mins','value'],['cryo_a','Cryopump-A 2nd / 1st temperature','<20 / <85 K','value'],['cryo_b','Cryopump-B 2nd / 1st temperature','<20 / <85 K','value'],['cryo_flow','Cryopump water flow rate','>9 L/min','value'],['cooler_flow','Cryocooler water flow rate (A/B/C/D)','>9 L/min','value']];const shutdown=[['vacuum_gas','Vacuum pressure with gas','<2.0E-3 Pa','value'],['coil_stop','Maximum upper coil temperature','<6.7 K','value'],['lead_stop','Maximum power lead temperature','<65 K','value'],['cryo_a_stop','Cryopump-A 2nd / 1st temperature','<20 / <85 K','value'],['cryo_b_stop','Cryopump-B 2nd / 1st temperature','<20 / <85 K','value']];const el=id=>document.getElementById(id);el('date').value=new Date().toISOString().slice(0,10);function setTimeMode(){const historical=el('entryType').value==='Historical';el('time').readOnly=!historical;if(!historical)el('time').value=new Date().toTimeString().slice(0,5);el('timeHint').textContent=historical?'Enter the original completion time':'Auto-recorded when submitted'}setTimeMode();function items(){return [...common,...(el('mode').value==='Startup'?startup:shutdown)]}function render(){el('form').innerHTML=items().map(([id,name,std,type])=>`<section class="group row" data-id="${id}"><div><b>${name}</b><br><small>Standard: ${std}</small></div><div>${type==='th'?'<select class="v"><option value="">Temperature / humidity</option><option>22-26°C / <60%</option><option>Other</option></select>':type==='choice'?'<select class="v"><option value="">Select</option><option>Normal</option><option>Abnormal</option><option>No leakage</option><option>No abnormality</option>':'<input class="v" placeholder="Enter displayed value">'}</div><div class="field"><label>Remark</label><input class="remark"></div><div><small>${type==='value'?'Numeric / displayed value':'Select the observed status'}</small></div></section>`).join('')}el('mode').onchange=render;el('entryType').onchange=setTimeMode;render();el('clear').onclick=()=>{document.querySelectorAll('.v,.remark').forEach(x=>x.value='');el('status').textContent=''};el('form').onsubmit=async e=>{e.preventDefault();const op1=el('op1').value.trim();if(!op1){el('status').textContent='Operator 1 is required.';el('status').className='status bad';return}const now=new Date(),historical=el('entryType').value==='Historical',completionTime=historical?el('time').value:now.toTimeString().slice(0,5),rows=[...document.querySelectorAll('.row')].map(r=>{const item=items().find(x=>x[0]===r.dataset.id),recorded=r.querySelector('.v').value,nums=recorded.match(/-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g)||[];return{place:'',device:'',parameterId:item[0],checkItem:item[1],unit:'',standardValue:item[2],recordedValue:recorded,value1:nums[0]||'',value2:nums[1]||'',value3:nums[2]||'',remark:r.querySelector('.remark').value,status:recorded==='Abnormal'?'Abnormal':''}}).filter(x=>x.recordedValue||x.remark);if(!completionTime){el('status').textContent='Enter the original completion time for a historical record.';el('status').className='status bad';return}if(!rows.length){el('status').textContent='Enter at least one inspection value.';el('status').className='status bad';return}const operatorMode=el('op2').value.trim()?'Two operators':'Single operator',payload={recordId:`${el('date').value}-${el('mode').value.toLowerCase()}-${Date.now()}`,inspectionDate:el('date').value,completionTime,inspectionType:el('mode').value,entryType:el('entryType').value,workMode:`${operatorMode}${historical?' / Historical':''}`,operator1:op1,operator2:el('op2').value.trim(),measurements:rows};el('status').textContent='Saving…';try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}),out=await res.json();if(!out.ok)throw new Error(out.error||'Google Sheet rejected the record');el('status').textContent=`Saved ${out.rowsAdded} row(s) to Google Sheet.`;el('status').className='status ok'}catch(err){el('status').textContent=`Save failed: ${err.message}`;el('status').className='status bad'}};
</script></body></html>
